<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PMM — прогноз агро для кукурузы">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#15803d"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="cob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- линия прогноза: рост показателей слева внизу к справа вверху -->
  <path d="M12 47 29 33 36 37 52 15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46 14 52 15l-1.5 6.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- початок кукурузы: листья -->
  <path d="M31.4 43.4c-4.6 5.6-11.4 8.2-16.6 7.2.4-5.4 4.6-10 10-12.2z" fill="#86efac"/>
  <path d="M32.6 43.4c4.6 5.6 11.4 8.2 16.6 7.2-.4-5.4-4.6-10-10-12.2z" fill="#86efac"/>

  <!-- початок кукурузы: зерно -->
  <path d="M32 8.6c5.8 3.4 8.8 9.4 8.8 16.4v11c0 5.2-3.9 9.2-8.8 9.2s-8.8-4-8.8-9.2V25c0-7 3-13 8.8-16.4z" fill="url(#cob)"/>
  <g fill="#b45309">
    <rect x="24.6" y="20.4" width="3.8" height="3.8" rx="1.5"/>
    <rect x="30.1" y="20.4" width="3.8" height="3.8" rx="1.5"/>
    <rect x="35.6" y="20.4" width="3.8" height="3.8" rx="1.5"/>
    <rect x="24.6" y="27.4" width="3.8" height="3.8" rx="1.5"/>
    <rect x="30.1" y="27.4" width="3.8" height="3.8" rx="1.5"/>
    <rect x="35.6" y="27.4" width="3.8" height="3.8" rx="1.5"/>
  </g>
</svg>
