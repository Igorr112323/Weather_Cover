<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PMM — прогноз агро для кукурузы">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="cob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="round"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- небо и солнце -->
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="47" cy="17" r="8" fill="#fef08a"/>
    <circle cx="47" cy="17" r="11" fill="#fef08a" fill-opacity=".28"/>

    <!-- поле с бороздами, сходящимися к горизонту -->
    <path d="M0 33c14-6 30-6 64 0v31H0z" fill="url(#field)"/>
    <g stroke="#14532d" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M8 64 26 33"/>
      <path d="M22 64 30 33"/>
      <path d="M42 64 34 33"/>
      <path d="M56 64 38 33"/>
    </g>
  </g>

  <!-- початок кукурузы: листья -->
  <path d="M25.6 47.4c-4.2 5-10.4 7.4-15.2 6.5.4-4.9 4.2-9.1 9.2-11.1z" fill="#86efac" stroke="#14532d" stroke-opacity=".5" stroke-width="1"/>
  <path d="M38.4 47.4c4.2 5 10.4 7.4 15.2 6.5-.4-4.9-4.2-9.1-9.2-11.1z" fill="#86efac" stroke="#14532d" stroke-opacity=".5" stroke-width="1"/>

  <!-- початок кукурузы: зерно -->
  <path d="M32 14c6.2 3.6 9.4 10 9.4 17.4v11.8c0 5.5-4.2 9.8-9.4 9.8s-9.4-4.3-9.4-9.8V31.4C22.6 24 25.8 17.6 32 14z" fill="url(#cob)" stroke="#b45309" stroke-width="1.2"/>
  <g fill="#d97706" fill-opacity=".85">
    <rect x="25.4" y="26" width="4" height="4" rx="1.6"/>
    <rect x="30" y="24.6" width="4" height="4" rx="1.6"/>
    <rect x="34.6" y="26" width="4" height="4" rx="1.6"/>
    <rect x="25.4" y="32.4" width="4" height="4" rx="1.6"/>
    <rect x="30" y="31.4" width="4" height="4" rx="1.6"/>
    <rect x="34.6" y="32.4" width="4" height="4" rx="1.6"/>
    <rect x="25.4" y="38.8" width="4" height="4" rx="1.6"/>
    <rect x="30" y="38.2" width="4" height="4" rx="1.6"/>
    <rect x="34.6" y="38.8" width="4" height="4" rx="1.6"/>
  </g>
</svg>
