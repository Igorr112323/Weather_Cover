name: Build Windows EXE

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build WeatherCover.exe (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Package Windows app
        run: npm run package:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherCover-win32-x64
          path: release/WeatherCover-win32-x64
          if-no-files-found: error
          retention-days: 14
