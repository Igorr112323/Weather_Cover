name: Build Windows EXE

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build WeatherCover.exe (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Package Windows app
        run: npm run package:win

      - name: Package ZIP
        shell: powershell
        run: |
          Compress-Archive -Path release/WeatherCover-win32-x64 -DestinationPath WeatherCover-win32-x64.zip -Force
          Get-Item WeatherCover-win32-x64.zip | Select-Object Name,Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherCover-win32-x64
          path: WeatherCover-win32-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.0-weather-cover"
          gh release delete $tag --yes 2>$null
          gh release create $tag `
            --title "WeatherCover Windows" `
            --notes "Собранный EXE для Windows: WeatherCover.exe (в архиве WeatherCover-win32-x64)." `
            WeatherCover-win32-x64.zip
