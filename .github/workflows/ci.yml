name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: API smoke tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgroCast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AgroCast/requirements.txt
      - run: python -m pip install --upgrade pip
      - name: Install API deps
        run: pip install fastapi uvicorn pydantic python-multipart pytest httpx
      - name: JS syntax
        run: node --check static/desktop.js || true
      - name: Python compile
        run: python -m compileall -q agrocast app.py
      - name: Run smoke tests
        run: python -m pytest tests/ -v

  build-exe:
    name: Build AgroCast-2.5-exe.zip (Windows)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: AgroCast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements (incl. PySide6 + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build EXE + zip
        run: python tools/build_exe.py

      - name: Upload EXE artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AgroCast-exe
          path: AgroCast/dist/AgroCast/AgroCast.exe

      - name: Upload ZIP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AgroCast-2.5-exe.zip
          path: AgroCast/dist/AgroCast-2.5-exe.zip

      - name: Publish GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.5.1 --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create v2.5.1 dist/AgroCast-2.5-exe.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgroCast 2.5 — EXE (каркас-оболочка, сборка v2.5.1)" \
            --notes "Каркас EXE AgroCast 2.5: Яндекс.Карта + Leaflet fallback, 28 точек P01–P28, справочник сортов (SQLite ~/.agrocast/crops.db), мок-прогнозы. Распакуйте zip и запустите AgroCast.exe."
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v2.5.1/AgroCast-2.5-exe.zip"
          echo "::notice title=DOWNLOAD_URL::$url"

      - name: Collect build diagnostics
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [Path("dist/build_error.txt"), Path("dist/build_exe.log")]
          text = ""
          src = ""
          for p in candidates:
              if p.exists():
                  text = p.read_text(encoding="utf-8", errors="replace")
                  src = p.name
                  break
          if not text.strip():
              print("::error title=no log::ни build_error.txt, ни build_exe.log не найдены")
          else:
              body = text[-3800:] or "log пуст"
              enc = body.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=AgroCast build log (END, {src})::{enc}")
          PY
