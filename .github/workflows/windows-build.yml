# Сборка и проверка «АгроПрогноз — Кукуруза» на Windows.
#
# Что делает:
#   1. Ставит зависимости, готовит иконки и геоданные.
#   2. Гоняет unit-тесты (node --test).
#   3. Собирает renderer (vite build).
#   4. Поднимает предпросмотр сборки и гоняет браузерный smoke-тест (Playwright).
#   5. Собирает portable EXE (electron-builder) и публикует артефакт
#      AgroPrognoz-<version>-portable.exe.
#   6. При пуше тега v* дополнительно создаёт GitHub Release с EXE.
#
# Платные сервисы не используются: только GitHub-hosted runner и npm.

name: windows-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  verify:
    name: Тесты и smoke
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Иконки и геоданные
        run: |
          npm run icon
          npm run prepare:assets

      - name: Unit-тесты
        run: npm test

      - name: Сборка renderer
        run: npm run build

      - name: Браузер для smoke-теста
        run: npx playwright install chromium

      - name: Предпросмотр сборки (фон)
        run: |
          npm run preview > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then
              echo "preview is up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:4173/ > /dev/null

      - name: Smoke-тест сценария
        timeout-minutes: 15
        run: npm run test:smoke

      - name: Остановить предпросмотр
        if: always()
        run: kill "$(cat preview.pid)" 2>/dev/null || true

      - name: Скриншоты smoke-теста
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/smoke/screenshots/
          if-no-files-found: warn
          retention-days: 14

  portable:
    name: Portable EXE
    runs-on: windows-latest
    needs: verify
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Иконки и геоданные
        run: |
          npm run icon
          npm run prepare:assets

      - name: Сборка renderer
        run: npm run build

      - name: Portable EXE
        timeout-minutes: 30
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Проверить артефакт
        run: ls -la release/

      - name: Артефакт AgroPrognoz-portable.exe
        uses: actions/upload-artifact@v4
        with:
          name: AgroPrognoz-portable
          path: release/AgroPrognoz-*-portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Release при теге v*
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${GITHUB_REF_NAME}" release/AgroPrognoz-*-portable.exe --title "${GITHUB_REF_NAME}" --notes "Portable-сборка для Windows (без установки)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
